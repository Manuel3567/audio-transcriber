[project]
name = "audio-transcriber"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai-whisper>=20250625",
    "sounddevice>=0.5.5",
]

[project.scripts]
audio-transcriber = "audio_transcriber.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
test = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = "-m 'not live_audio'"
markers = ["live_audio: interactive test requiring user input"]
